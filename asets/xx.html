<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <script src="./js/pokemon.js"></script>
        <title>MOKEPON!</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="./style/style.css">
    </head>
    <body>
        
        <section id="seleccionar-mascota">    
            <h1 class="titulo">Mokepon</h1>

            <h2 class="subtitulo">Elige tu mascota:</h2>

            <div class="tarjetas">
               <label class="tarjeta-de-mokepon"  for="hipodoge">
               <p>Hipodoge</p>
               <img src="./asetss/mokepons_mokepon_hipodoge_attack.webp" alt="hipodoge" />
               </label>
               <input type="radio" name="mascota" id="hipodoge" />
            
               <label class="tarjeta-de-mokepon"  for="capipepo">
                <p>Capipepo</p>
                <img src="./asetss/mokepons_mokepon_capipepo_attack.webp" alt="capipepo" />
               </label>
               <input type="radio" name="mascota" id="capipepo" />
            
               <label class="tarjeta-de-mokepon" for="ratigueya">
                <p>Ratigueya</p>
                <img src="./asetss/mokepons_mokepon_ratigueya_attack.webp" alt="ratigueya" />
               </label>
               <input type="radio" name="mascota" id="ratigueya" />
            </div>

            <button id="boton-mascota">Seleccionar</button>
        </section>

        <section id="seleccionar-ataque">
            <h1 class="titulo">Mokepon</h1>

            <h2 class="subtitulo">Elige tu ataque:</h2>

             <div class="contenedor-ataques">
                         <button id="boton-fuego">Fuego 🔥</button>
                         <button id="boton-agua">Agua 💧</button>
                         <button id="boton-tierra">Tierra 🌱</button>
             </div>

             <section id="reiniciar">
                 <button id="boton-reiniciar">Reiniciar</button>
             </section>
                <div>
                 <section id="mensajes">
                     <!-- <p>Tu mascota atacó con FUEGO, las mascota del enemigo atacó con TIERRA - GANASTE 🎉</p> -->
                    </section>
                    
                    
                    <p>Tu mascota 
                        <span id="mascota-jugador"></span> tiene 
                        <span id="vidas-jugador">3</span> vidas
                    </p>
                    
                    <p>La mascota del enemigo
                        <span id="mascota-enemigo"></span>tiene 
                        <span id="vidas-enemigo">3</span> vidas
                    </p>
                    
                     
                    
                </div>
        </section>

    </body>
</html>
